# Scan published community release EXEs on VirusTotal, then insert a
# "## VirusTotal" section into release notes immediately before [!IMPORTANT].
# Requires repo secret VIRUSTOTAL_API_KEY (VirusTotal API key).
name: VirusTotal

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  virustotal:
    name: Scan release assets
    runs-on: ubuntu-latest
    steps:
      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: false
          request_rate: 4
          files: |
            .exe$

      - name: Insert VirusTotal section in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${ANALYSIS:-}" ]; then
            echo "::warning::No VirusTotal analysis output; skipping release notes update."
            exit 0
          fi

          BODY="$(gh release view "$TAG" --json body -q .body)"
          export BODY ANALYSIS

          NOTES_FILE="$(mktemp)"
          python3 - <<'PY' > "$NOTES_FILE"
          import os
          import re

          body = os.environ.get("BODY") or ""
          analysis = (os.environ.get("ANALYSIS") or "").strip()

          bullets = []
          for part in analysis.split(","):
              part = part.strip()
              if not part or "=" not in part:
                  continue
              name, url = part.split("=", 1)
              name = os.path.basename(name.strip())
              url = url.strip()
              if name and url:
                  bullets.append(f"- [`{name}`]({url})")

          if not bullets:
              raise SystemExit("parsed zero VirusTotal links from analysis output")

          section = "## VirusTotal\n\n" + "\n".join(bullets)

          # Drop prior ## VirusTotal block (ours) and crazy-max append leftovers.
          body = re.sub(
              r"\n*## VirusTotal\n(?:.*?\n)*?(?=\n## |\n> \[!IMPORTANT\]|\n*🛡 |\Z)",
              "\n",
              body,
              count=1,
              flags=re.S,
          )
          body = re.sub(
              r"\n*🛡 \[VirusTotal GitHub Action\][^\n]*(?:\n \* \[`[^\n]+)*",
              "",
              body,
          )
          body = re.sub(
              r"\n*<details>\n?\s*<summary>\s*🛡 VirusTotal analysis.*?</details>",
              "",
              body,
              flags=re.S | re.I,
          )
          body = body.rstrip() + "\n"

          important = "\n> [!IMPORTANT]"
          idx = body.find(important)
          if idx >= 0:
              body = body[:idx].rstrip() + "\n\n" + section + "\n" + body[idx:].lstrip("\n")
          else:
              body = body.rstrip() + "\n\n" + section + "\n"

          print(body, end="" if body.endswith("\n") else "\n")
          PY

          gh release edit "$TAG" --notes-file "$NOTES_FILE"
          echo "Updated release $TAG notes with VirusTotal section."
