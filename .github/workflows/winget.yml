name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      release:
        description: Which GitHub Release to use — latest skips drafts and pre-releases
        required: true
        type: choice
        default: latest
        options:
          - latest
          - custom
      release_tag:
        description: Release tag when release=custom (e.g. v2.0.0-alpha.2). Required for custom; ignored for latest.
        required: false
        type: string
        default: ''
      dry_run:
        description: "Dry run (checked/default): validate only, no winget-pkgs PR. Uncheck to publish to WinGet."
        required: true
        default: true
        type: boolean
      install_test:
        description: "Best-effort silent install smoke test using release asset already on runner (not winget install). Warns and skips on failure; never fails dry-run."
        required: true
        default: true
        type: boolean
      verify_public_urls:
        description: "Verify anonymous GitHub release URLs download and match SHA256 (required for WinGet)."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: winget-${{ github.repository }}-${{ inputs.release }}-${{ inputs.release_tag }}-${{ inputs.dry_run }}
  cancel-in-progress: false

env:
  WINGET_PACKAGE_IDENTIFIER: AuthorSoftware.NVMWindows

jobs:
  validate:
    name: Generate and validate manifest
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      manifest_dir: ${{ steps.validate.outputs.manifest_dir }}
      pull_request_url: ${{ steps.submit.outputs.pull_request_url }}
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            build/steps/New-WingetManifest.ps1
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Resolve release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHOICE: ${{ inputs.release }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          VERIFY_PUBLIC_URLS: ${{ inputs.verify_public_urls }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          function Test-WorkflowBool([string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { return $false }
            return [System.Convert]::ToBoolean($Value)
          }

          $dryRun = Test-WorkflowBool $env:DRY_RUN
          $verifyPublicUrls = Test-WorkflowBool $env:VERIFY_PUBLIC_URLS
          if (-not $dryRun -and -not $verifyPublicUrls) {
            throw "verify_public_urls must be true when dry_run is false (WinGet needs anonymous download URLs)."
          }

          $repo = '${{ github.repository }}'
          if ($env:RELEASE_CHOICE -eq 'latest') {
            $releases = @(gh release list --repo $repo --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json)
            if ($releases.Count -lt 1 -or [string]::IsNullOrWhiteSpace([string]$releases[0].tagName)) {
              throw "No non-draft, non-prerelease GitHub Release found in $repo."
            }
            $tag = [string]$releases[0].tagName
            Write-Host "Resolved latest release tag -> $tag"
          }
          else {
            $tag = [string]($env:RELEASE_TAG_INPUT).Trim()
            if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "release=custom requires release_tag (for example v2.0.0)."
            }
          }

          if ($tag -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "release tag must be SemVer, optionally prefixed with v: $tag"
          }
          gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release not found: $tag" }

          $version = $tag -replace '^[vV]', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download released installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo "${{ github.repository }}" `
            --pattern 'nvm-*-setup.exe' `
            --dir release-assets `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download release installers." }
          Get-ChildItem -LiteralPath release-assets -File | ForEach-Object {
            Write-Host "release asset -> $($_.Name) ($($_.Length) bytes)"
          }

      - name: Generate WinGet manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          & .\build\steps\New-WingetManifest.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Repository $env:REPOSITORY `
            -InstallerDirectory (Join-Path $PWD 'release-assets') `
            -OutputDirectory (Join-Path $PWD 'winget-output')

      - name: Verify public release URLs and hashes
        if: inputs.verify_public_urls == true
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          $version = $tag -replace '^[vV]', ''
          $failed = $false

          foreach ($arch in @('x64', 'arm64')) {
            $asset = "nvm-$version-$arch-setup.exe"
            $source = Join-Path $PWD "release-assets\$asset"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Expected downloaded asset missing: $source"
            }

            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
            $download = Join-Path $env:RUNNER_TEMP $asset
            try {
              Invoke-WebRequest -Uri $url -OutFile $download
            }
            catch {
              $failed = $true
              Write-Warning "Public URL check failed for ${asset}: $($_.Exception.Message)"
              continue
            }

            $expected = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
            if ($actual -ne $expected) {
              $failed = $true
              Write-Warning "Public URL hash mismatch for $asset. expected=$expected actual=$actual"
              continue
            }
            Write-Host "Public URL + SHA256 verified -> $asset"
          }

          if ($failed) {
            throw "Public URL verification failed. Release assets must be anonymously downloadable before WinGet publish."
          }

      - name: Validate manifest with WinGet
        id: validate
        run: |
          $version = ($env:RELEASE_TAG.Trim() -replace '^[vV]', '')
          $manifestDir = Join-Path $PWD "winget-output\manifests\a\AuthorSoftware\NVMWindows\$version"
          $manifest = Join-Path $manifestDir "$env:WINGET_PACKAGE_IDENTIFIER.yaml"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Version manifest missing: $manifest"
          }
          winget --version
          winget validate --manifest $manifestDir --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed." }
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_dir=$manifestDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install smoke test (optional)
        id: install_test
        if: inputs.install_test == true
        timeout-minutes: 5
        run: |
          function Write-InstallTestSkipped([string]$Reason) {
            Write-Warning "Install smoke test skipped: $Reason"
            "ran=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          # Run the x64 Inno installer from release-assets (already downloaded above).
          # winget install --manifest re-downloads from GitHub and can hang on GHA
          # (elevation prompts, winget dependency resolution).
          $version = $env:RELEASE_TAG.Trim() -replace '^[vV]', ''
          $installer = Join-Path $PWD "release-assets\nvm-$version-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-InstallTestSkipped "release asset missing: $installer"
            exit 0
          }

          Write-Host "Running local installer smoke test -> $installer"
          $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(240000)) {
            try { $proc.Kill($true) } catch { $proc.Kill() }
            Write-InstallTestSkipped "installer did not finish within 4 minutes."
            exit 0
          }
          if ($proc.ExitCode -ne 0) {
            Write-InstallTestSkipped "installer exited with code $($proc.ExitCode)."
            exit 0
          }

          $nvm = Join-Path $env:LOCALAPPDATA 'Author Software\nvm\nvm.exe'
          if (-not (Test-Path -LiteralPath $nvm -PathType Leaf)) {
            Write-InstallTestSkipped "nvm.exe missing after install."
            exit 0
          }

          & $nvm --version 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-InstallTestSkipped "nvm --version failed after install."
            exit 0
          }

          Write-Host "Install smoke test passed."
          "ran=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Uninstall test installation
        if: always() && inputs.install_test == true && steps.install_test.outputs.ran == 'true'
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Author Software\nvm\unins000.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $proc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -NoNewWindow
            if (-not $proc.WaitForExit(120000)) {
              try { $proc.Kill($true) } catch { $proc.Kill() }
              Write-Warning "Test uninstaller did not finish within 2 minutes (ignored)."
            }
            elseif ($proc.ExitCode -ne 0) {
              Write-Warning "Test uninstaller exited with code $($proc.ExitCode) (ignored)."
            }
          }
          else {
            Write-Host "No uninstaller found; nothing to clean up."
          }

      - name: Upload generated manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest-${{ steps.meta.outputs.tag || github.run_id }}
          path: winget-output/manifests/
          if-no-files-found: warn
          retention-days: 30

      - name: Submit to microsoft/winget-pkgs
        id: submit
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          MANIFEST_DIR: ${{ steps.validate.outputs.manifest_dir }}
          FORK_OWNER: nvm-windows
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "dry_run is false but secret WINGET_CREATE_GITHUB_TOKEN is empty. Set a classic PAT with public_repo and workflow for a user who can push to nvm-windows/winget-pkgs."
          }

          $login = (gh api user --jq .login).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($login)) {
            throw "WINGET_CREATE_GITHUB_TOKEN could not read the GitHub user. Use a classic PAT with public_repo and workflow."
          }
          Write-Host "WinGet token user -> $login"

          $packageId = $env:WINGET_PACKAGE_IDENTIFIER
          if ([string]::IsNullOrWhiteSpace($packageId)) { throw "WINGET_PACKAGE_IDENTIFIER is empty." }
          $version = ($env:RELEASE_TAG.Trim() -replace '^[vV]', '')
          if ([string]::IsNullOrWhiteSpace($version)) { throw "RELEASE_TAG is empty." }

          # AuthorSoftware.NVMWindows is a new package. This pull request adds that id.
          # It does not update CoreyButler.NVMforWindows. wingetcreate submit always
          # writes to the token user's fork, so the pull request is opened from the org fork.
          $fork = "$($env:FORK_OWNER)/winget-pkgs"
          $upstream = 'microsoft/winget-pkgs'
          Write-Host "Package -> $packageId version $version"
          Write-Host "Fork -> $fork"

          $forkName = gh api "repos/$fork" --jq .full_name 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($forkName)) {
            Write-Host "Creating fork $fork"
            gh repo fork $upstream --org $env:FORK_OWNER --clone=false
            if ($LASTEXITCODE -ne 0) { throw "Could not fork $upstream into $($env:FORK_OWNER)." }
          }

          $archived = (gh api "repos/$fork" --jq .archived).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read $fork." }
          if ($archived -eq 'true') {
            Write-Host "Unarchiving $fork so it can accept the package branch."
            gh api --method PATCH "repos/$fork" -F archived=false
            if ($LASTEXITCODE -ne 0) { throw "Could not unarchive $fork." }
          }

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            gh api "repos/$fork/git/ref/heads/master" 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Write-Host "Waiting for $fork master..."
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw "Fork $fork has no master branch yet." }

          gh repo sync $fork --branch master
          if ($LASTEXITCODE -ne 0) {
            throw "Could not sync $fork with $upstream master. winget-pkgs updates .github/workflows, so WINGET_CREATE_GITHUB_TOKEN must be a classic PAT with public_repo and workflow. Add the workflow scope on the existing token, then re-run."
          }

          $baseSha = (gh api "repos/$fork/git/ref/heads/master" --jq .object.sha).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseSha)) {
            throw "Could not read $fork master SHA."
          }
          $baseTree = (gh api "repos/$fork/git/commits/$baseSha" --jq .tree.sha).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseTree)) {
            throw "Could not read the tree for $baseSha."
          }

          $outputRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'winget-output')).Path
          $manifestFiles = @(Get-ChildItem -LiteralPath $env:MANIFEST_DIR -File)
          if ($manifestFiles.Count -lt 1) { throw "No manifest files in $($env:MANIFEST_DIR)." }

          $tree = New-Object System.Collections.Generic.List[object]
          foreach ($file in $manifestFiles) {
            $relative = [System.IO.Path]::GetRelativePath($outputRoot, $file.FullName).Replace('\', '/')
            if ($relative -notlike 'manifests/*') { throw "Manifest path is outside manifests/: $relative" }
            $tree.Add([ordered]@{
              path = $relative
              mode = '100644'
              type = 'blob'
              content = [System.IO.File]::ReadAllText($file.FullName)
            })
          }

          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $treeJsonPath = Join-Path $env:RUNNER_TEMP 'winget-tree.json'
          $treeJson = @{ base_tree = $baseTree; tree = $tree } | ConvertTo-Json -Depth 6 -Compress
          [System.IO.File]::WriteAllText($treeJsonPath, $treeJson, $utf8)
          $treeSha = (gh api --method POST "repos/$fork/git/trees" --input $treeJsonPath --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($treeSha)) {
            throw "Could not create the manifest tree on $fork."
          }

          $segments = $packageId.Split('.')
          $packagePath = "manifests/$($segments[0].Substring(0,1).ToLowerInvariant())/$($segments -join '/')"
          gh api "repos/$upstream/contents/$packagePath" 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            $title = "Add version: $packageId version $version"
          }
          else {
            $title = "New package: $packageId version $version"
          }
          Write-Host "Pull request title -> $title"

          $commitJsonPath = Join-Path $env:RUNNER_TEMP 'winget-commit.json'
          $commitJson = @{ message = $title; tree = $treeSha; parents = @($baseSha) } | ConvertTo-Json -Depth 5 -Compress
          if ($commitJson -notmatch '"parents"\s*:\s*\[') {
            throw "Commit parents were not serialized as a JSON array."
          }
          [System.IO.File]::WriteAllText($commitJsonPath, $commitJson, $utf8)
          $commitSha = (gh api --method POST "repos/$fork/git/commits" --input $commitJsonPath --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($commitSha)) {
            throw "Could not create the manifest commit on $fork."
          }

          $branch = "$packageId-$version-$([guid]::NewGuid().ToString('n').Substring(0, 8))"
          gh api --method POST "repos/$fork/git/refs" -f ref="refs/heads/$branch" -f sha="$commitSha"
          if ($LASTEXITCODE -ne 0) { throw "Could not create branch $branch on $fork." }

          $bodyPath = Join-Path $env:RUNNER_TEMP 'winget-pr-body.md'
          $tag = $env:RELEASE_TAG.Trim()
          $body = "$title`n`nNode.js version manager for Windows.`nhttps://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$tag"
          [System.IO.File]::WriteAllText($bodyPath, $body.Trim() + "`n", $utf8)

          $prOutput = gh pr create --repo $upstream --base master --head "$($env:FORK_OWNER):$branch" --title $title --body-file $bodyPath
          if ($LASTEXITCODE -ne 0) { throw "Could not open the winget-pkgs pull request." }
          $prUrl = @($prOutput -split "`r?`n" | Where-Object { $_ -match '^https://github\.com/.+/pull/\d+\s*$' } | ForEach-Object { $_.Trim() }) | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($prUrl)) {
            throw "winget-pkgs pull request was created but no URL was returned. Output: $prOutput"
          }
          Write-Host "Pull request -> $prUrl"
          Write-Host "::notice title=WinGet pull request::$prUrl"
          "pull_request_url=$prUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### WinGet pull request`n`n$prUrl`n", $utf8)
